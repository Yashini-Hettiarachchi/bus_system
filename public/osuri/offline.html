<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Osuri Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f6f9fc, #eaf3fb);
        color: #1e3a53;
      }
      .card {
        max-width: 520px;
        margin: 24px;
        padding: 24px;
        border-radius: 14px;
        background: #ffffff;
        border: 1px solid #d8e3ef;
        box-shadow: 0 10px 26px rgba(28, 59, 86, 0.1);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.5rem;
      }
      p {
        margin: 8px 0;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>Osuri is available in offline mode for pages and data that were already cached on this device.</p>
      <p>Reconnect to the internet to refresh live advertisements and status updates.</p>
    </main>
  </body>
</html>
